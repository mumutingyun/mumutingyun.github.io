<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Updates - 博客管理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }
    .container { max-width: 780px; margin: 0 auto; padding: 40px 20px; }
    h1 {
      font-size: 1.8em;
      font-weight: 700;
      margin-bottom: 8px;
      color: #222;
    }
    .subtitle {
      font-size: 0.9em;
      color: #888;
      margin-bottom: 32px;
    }
    .repo-link {
      color: #258fb8;
      text-decoration: none;
      font-weight: 500;
    }
    .repo-link:hover { text-decoration: underline; }
    .loading, .error { text-align: center; padding: 60px 20px; color: #999; }
    .error { color: #c0392b; }
    .commit-list { list-style: none; }
    .commit-item {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 12px;
      transition: box-shadow 0.15s;
    }
    .commit-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .commit-message {
      font-size: 1.02em;
      font-weight: 600;
      color: #222;
      margin-bottom: 6px;
      word-break: break-all;
    }
    .commit-meta {
      font-size: 0.85em;
      color: #888;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
    }
    .commit-sha {
      font-family: "SF Mono", "Consolas", monospace;
      font-size: 0.78em;
      color: #aaa;
      background: #f0f0f0;
      padding: 1px 6px;
      border-radius: 3px;
    }
    .commit-sha a {
      color: inherit;
      text-decoration: none;
    }
    .commit-sha a:hover { color: #258fb8; }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-top: 28px;
    }
    .pagination button {
      padding: 8px 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9em;
    }
    .pagination button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .pagination button:hover:not(:disabled) {
      background: #258fb8;
      color: #fff;
      border-color: #258fb8;
    }
    .page-info { font-size: 0.9em; color: #666; }
    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #258fb8;
      text-decoration: none;
      font-size: 0.9em;
    }
    .back-link:hover { text-decoration: underline; }
    footer {
      text-align: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid #e0e0e0;
      font-size: 0.82em;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-link">&larr; 返回博客首页</a>
    <h1>📋 Updates</h1>
    <p class="subtitle">
      仓库 <a class="repo-link" href="https://github.com/mumutingyun/mumutingyun.github.io" target="_blank">mumutingyun/mumutingyun.github.io</a> 的提交历史
    </p>

    <div id="status" class="loading">正在加载提交记录…</div>
    <ul id="commitList" class="commit-list" style="display:none;"></ul>
    <div id="pagination" class="pagination" style="display:none;"></div>

    <footer>
      <p>数据来自 GitHub API · 每页显示 20 条</p>
    </footer>
  </div>

  <script>
    (function() {
      var REPO = 'mumutingyun/mumutingyun.github.io';
      var BRANCH = 'main';
      var PER_PAGE = 20;
      var TOKEN = '';  // 公开访问，无需 token
      var currentPage = 1;
      var totalCommits = null;

      var statusEl = document.getElementById('status');
      var listEl = document.getElementById('commitList');
      var paginationEl = document.getElementById('pagination');

      function showStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.className = isError ? 'error' : 'loading';
        statusEl.style.display = 'block';
        listEl.style.display = 'none';
        paginationEl.style.display = 'none';
      }

      function timeAgo(dateStr) {
        var now = new Date();
        var d = new Date(dateStr);
        var diff = Math.floor((now - d) / 1000);
        if (diff < 60) return '刚刚';
        if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
        if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
        if (diff < 2592000) return Math.floor(diff / 86400) + ' 天前';
        if (diff < 31536000) return Math.floor(diff / 2592000) + ' 个月前';
        return Math.floor(diff / 31536000) + ' 年前';
      }

      function formatDate(dateStr) {
        var d = new Date(dateStr);
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0') + ' ' +
               String(d.getHours()).padStart(2, '0') + ':' +
               String(d.getMinutes()).padStart(2, '0');
      }

      function loadPage(page) {
        showStatus('正在加载第 ' + page + ' 页…', false);
        currentPage = page;

        var url = 'https://api.github.com/repos/' + REPO + '/commits?sha=' + BRANCH + '&per_page=' + PER_PAGE + '&page=' + page;

        var headers = { 'Accept': 'application/vnd.github.v3+json' };
        if (TOKEN) {
          headers['Authorization'] = 'token ' + TOKEN;
        }
        fetch(url, { headers: headers })
        .then(function(resp) {
          if (!resp.ok) {
            throw new Error('GitHub API 返回 ' + resp.status + ': ' + resp.statusText);
          }
          // Check Link header for last page
          var linkHeader = resp.headers.get('Link');
          if (linkHeader) {
            var match = linkHeader.match(/&page=(\d+)>; rel="last"/);
            if (match) {
              totalCommits = parseInt(match[1], 10) * PER_PAGE;
            }
          }
          return resp.json();
        })
        .then(function(commits) {
          if (!commits || commits.length === 0) {
            if (page === 1) {
              showStatus('暂无提交记录', false);
            } else {
              loadPage(page - 1);
            }
            return;
          }
          renderCommits(commits);
          renderPagination(page);
        })
        .catch(function(err) {
          showStatus('加载失败：' + err.message, true);
          console.error(err);
        });
      }

      function renderCommits(commits) {
        statusEl.style.display = 'none';
        listEl.style.display = 'block';
        listEl.innerHTML = '';

        commits.forEach(function(c) {
          var sha = c.sha.substring(0, 7);
          var htmlUrl = c.html_url;
          var msg = escapeHtml(c.commit.message.split('\n')[0]);
          var author = c.commit.author ? escapeHtml(c.commit.author.name) : (c.author ? escapeHtml(c.author.login) : 'Unknown');
          var date = c.commit.author ? c.commit.author.date : c.commit.committer.date;

          var li = document.createElement('li');
          li.className = 'commit-item';
          li.innerHTML =
            '<div class="commit-message">' + msg + '</div>' +
            '<div class="commit-meta">' +
              '<span>' + author + '</span>' +
              '<span>' + formatDate(date) + ' <span style="color:#aaa;">(' + timeAgo(date) + ')</span></span>' +
              '<span class="commit-sha"><a href="' + htmlUrl + '" target="_blank" title="查看提交详情">' + sha + '</a></span>' +
            '</div>';
          listEl.appendChild(li);
        });
      }

      function renderPagination(page) {
        paginationEl.style.display = 'flex';
        var hasPrev = page > 1;
        var hasNext = true; // Assume more pages exist; GitHub API will handle
        // If returned less than PER_PAGE, assume last page
        // But we'd need to know count. Simpler: if items < PER_PAGE, disable next
        var itemsCount = listEl.querySelectorAll('.commit-item').length;
        hasNext = itemsCount >= PER_PAGE;

        paginationEl.innerHTML =
          '<button id="prevBtn"' + (hasPrev ? '' : ' disabled') + '>上一页</button>' +
          '<span class="page-info">第 ' + page + ' 页</span>' +
          '<button id="nextBtn"' + (hasNext ? '' : ' disabled') + '>下一页</button>';

        if (hasPrev) {
          document.getElementById('prevBtn').addEventListener('click', function() { loadPage(page - 1); });
        }
        if (hasNext) {
          document.getElementById('nextBtn').addEventListener('click', function() { loadPage(page + 1); });
        }
      }

      function escapeHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
      }

      // Start
      loadPage(1);
    })();
  </script>
</body>
</html>
